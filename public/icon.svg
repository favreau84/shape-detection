<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#F57C00"/>

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1"/>
  </g>

  <!-- Irregular blister shape -->
  <path
    d="M220,120 L290,105 L350,130 L390,185 L400,255 L385,320 L345,370 L290,390 L230,385 L175,355 L140,295 L130,230 L145,170 L185,135 Z"
    fill="rgba(255,255,255,0.18)"
    stroke="white"
    stroke-width="8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Vertex dots -->
  <circle cx="220" cy="120" r="9" fill="white"/>
  <circle cx="350" cy="130" r="9" fill="white"/>
  <circle cx="400" cy="255" r="9" fill="white"/>
  <circle cx="345" cy="370" r="9" fill="white"/>
  <circle cx="230" cy="385" r="9" fill="white"/>
  <circle cx="140" cy="295" r="9" fill="white"/>
  <circle cx="145" cy="170" r="9" fill="white"/>

  <!-- Crosshair center -->
  <g transform="translate(265, 250)" opacity="0.85">
    <line x1="0" y1="-22" x2="0" y2="-8" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="0" y2="22" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="-8" y2="0" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="22" y2="0" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Scale bar bottom-left -->
  <line x1="55" y1="448" x2="175" y2="448" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="434" x2="55" y2="462" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="175" y1="434" x2="175" y2="462" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <text x="115" y="428" text-anchor="middle" fill="white" font-size="30" font-weight="700" font-family="system-ui, sans-serif">cm²</text>
</svg>
