<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full orange background (no rounded corners — Android applies its own mask) -->
  <rect width="512" height="512" fill="#F57C00"/>

  <!-- Content within the safe zone (center 80% = 51px–461px) -->
  <g transform="translate(256,256) scale(0.65) translate(-256,-256)">
    <!-- Subtle grid -->
    <g opacity="0.06">
      <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1.5"/>
      <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1.5"/>
      <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1.5"/>
      <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1.5"/>
      <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1.5"/>
      <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1.5"/>
    </g>

    <!-- Irregular blister shape -->
    <path
      d="M220,120 L290,105 L350,130 L390,185 L400,255 L385,320 L345,370 L290,390 L230,385 L175,355 L140,295 L130,230 L145,170 L185,135 Z"
      fill="rgba(255,255,255,0.18)"
      stroke="white"
      stroke-width="10"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Vertex dots -->
    <circle cx="220" cy="120" r="11" fill="white"/>
    <circle cx="350" cy="130" r="11" fill="white"/>
    <circle cx="400" cy="255" r="11" fill="white"/>
    <circle cx="345" cy="370" r="11" fill="white"/>
    <circle cx="230" cy="385" r="11" fill="white"/>
    <circle cx="140" cy="295" r="11" fill="white"/>
    <circle cx="145" cy="170" r="11" fill="white"/>

    <!-- Crosshair center -->
    <g transform="translate(265, 250)" opacity="0.85">
      <line x1="0" y1="-22" x2="0" y2="-8" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="22" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="-22" y1="0" x2="-8" y2="0" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="8" y1="0" x2="22" y2="0" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <!-- Scale bar bottom -->
    <line x1="160" y1="460" x2="350" y2="460" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="160" y1="444" x2="160" y2="476" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="350" y1="444" x2="350" y2="476" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <text x="255" y="438" text-anchor="middle" fill="white" font-size="34" font-weight="700" font-family="system-ui, sans-serif">cm²</text>
  </g>
</svg>
