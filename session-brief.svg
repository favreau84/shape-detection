<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2A2020"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#EF5350"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#AB47BC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1400" fill="url(#bg)" rx="20"/>

  <!-- Header -->
  <rect x="40" y="40" width="720" height="120" rx="16" fill="#252525"/>
  <rect x="40" y="40" width="6" height="120" rx="3" fill="url(#orangeGrad)"/>
  <text x="70" y="85" fill="#F57C00" font-size="16" font-weight="600" letter-spacing="2">SESSION BRIEF</text>
  <text x="70" y="125" fill="white" font-size="32" font-weight="800">Mesure Cloque — PWA</text>
  <text x="660" y="80" fill="#757575" font-size="14" text-anchor="end">26 mars 2026</text>
  <text x="660" y="105" fill="#757575" font-size="14" text-anchor="end">1 après-midi</text>
  <!-- Orange dot indicator -->
  <circle cx="730" cy="90" r="20" fill="#F57C00" opacity="0.15"/>
  <circle cx="730" cy="90" r="8" fill="#F57C00"/>

  <!-- KPIs Row -->
  <g transform="translate(40, 190)">
    <!-- Exchanges -->
    <rect width="165" height="100" rx="12" fill="#252525"/>
    <text x="82" y="45" fill="#F57C00" font-size="36" font-weight="800" text-anchor="middle">20</text>
    <text x="82" y="72" fill="#9E9E9E" font-size="13" font-weight="500" text-anchor="middle">échanges</text>

    <!-- Commits -->
    <g transform="translate(185, 0)">
      <rect width="165" height="100" rx="12" fill="#252525"/>
      <text x="82" y="45" fill="#42A5F5" font-size="36" font-weight="800" text-anchor="middle">18</text>
      <text x="82" y="72" fill="#9E9E9E" font-size="13" font-weight="500" text-anchor="middle">commits</text>
    </g>

    <!-- Files -->
    <g transform="translate(370, 0)">
      <rect width="165" height="100" rx="12" fill="#252525"/>
      <text x="82" y="45" fill="#66BB6A" font-size="36" font-weight="800" text-anchor="middle">15</text>
      <text x="82" y="72" fill="#9E9E9E" font-size="13" font-weight="500" text-anchor="middle">fichiers créés</text>
    </g>

    <!-- JH equiv -->
    <g transform="translate(555, 0)">
      <rect width="165" height="100" rx="12" fill="#252525"/>
      <text x="82" y="45" fill="#FF9800" font-size="36" font-weight="800" text-anchor="middle">7-8</text>
      <text x="82" y="72" fill="#9E9E9E" font-size="13" font-weight="500" text-anchor="middle">jours-homme éq.</text>
    </g>
  </g>

  <!-- Timeline Title -->
  <text x="40" y="345" fill="white" font-size="20" font-weight="700">Phases d'itération</text>
  <line x1="40" y1="360" x2="760" y2="360" stroke="#424242" stroke-width="1"/>

  <!-- Phase 1 -->
  <g transform="translate(40, 380)">
    <rect width="720" height="90" rx="12" fill="#252525"/>
    <rect width="6" height="90" rx="3" fill="url(#orangeGrad)"/>
    <text x="30" y="28" fill="#F57C00" font-size="12" font-weight="700" letter-spacing="1">PHASE 1</text>
    <text x="30" y="50" fill="white" font-size="16" font-weight="600">Scaffolding &amp; Déploiement</text>
    <text x="30" y="72" fill="#9E9E9E" font-size="13">Vite + React + PWA + GitHub Pages CI/CD</text>
    <rect x="580" y="20" width="110" height="28" rx="14" fill="#F57C00" opacity="0.15"/>
    <text x="635" y="39" fill="#F57C00" font-size="12" font-weight="600" text-anchor="middle">~3 échanges</text>
    <!-- Complexity bar -->
    <rect x="580" y="58" width="110" height="6" rx="3" fill="#424242"/>
    <rect x="580" y="58" width="30" height="6" rx="3" fill="url(#orangeGrad)"/>
  </g>

  <!-- Phase 2 -->
  <g transform="translate(40, 485)">
    <rect width="720" height="90" rx="12" fill="#252525"/>
    <rect width="6" height="90" rx="3" fill="url(#blueGrad)"/>
    <text x="30" y="28" fill="#42A5F5" font-size="12" font-weight="700" letter-spacing="1">PHASE 2</text>
    <text x="30" y="50" fill="white" font-size="16" font-weight="600">Éditeur de polygone</text>
    <text x="30" y="72" fill="#9E9E9E" font-size="13">Pan/zoom SVG, crosshair, draw/edit, toggle, scale modal</text>
    <rect x="580" y="20" width="110" height="28" rx="14" fill="#42A5F5" opacity="0.15"/>
    <text x="635" y="39" fill="#42A5F5" font-size="12" font-weight="600" text-anchor="middle">~4 échanges</text>
    <rect x="580" y="58" width="110" height="6" rx="3" fill="#424242"/>
    <rect x="580" y="58" width="60" height="6" rx="3" fill="url(#blueGrad)"/>
  </g>

  <!-- Phase 3 -->
  <g transform="translate(40, 590)">
    <rect width="720" height="90" rx="12" fill="#252525"/>
    <rect width="6" height="90" rx="3" fill="url(#redGrad)"/>
    <text x="30" y="28" fill="#EF5350" font-size="12" font-weight="700" letter-spacing="1">PHASE 3</text>
    <text x="30" y="50" fill="white" font-size="16" font-weight="600">IA Segmentation (pivot)</text>
    <text x="30" y="72" fill="#9E9E9E" font-size="13">transformers.js → 3 bugs → pivot OpenCV.js</text>
    <rect x="580" y="20" width="110" height="28" rx="14" fill="#EF5350" opacity="0.15"/>
    <text x="635" y="39" fill="#EF5350" font-size="12" font-weight="600" text-anchor="middle">~4 échanges</text>
    <rect x="580" y="58" width="110" height="6" rx="3" fill="#424242"/>
    <rect x="580" y="58" width="95" height="6" rx="3" fill="url(#redGrad)"/>
  </g>

  <!-- Phase 4 -->
  <g transform="translate(40, 695)">
    <rect width="720" height="90" rx="12" fill="#252525"/>
    <rect width="6" height="90" rx="3" fill="url(#greenGrad)"/>
    <text x="30" y="28" fill="#66BB6A" font-size="12" font-weight="700" letter-spacing="1">PHASE 4</text>
    <text x="30" y="50" fill="white" font-size="16" font-weight="600">Détection OpenCV</text>
    <text x="30" y="72" fill="#9E9E9E" font-size="13">Mètre jaune HSV, contour noir, autocorrélation, snap cm</text>
    <rect x="580" y="20" width="110" height="28" rx="14" fill="#66BB6A" opacity="0.15"/>
    <text x="635" y="39" fill="#66BB6A" font-size="12" font-weight="600" text-anchor="middle">~4 échanges</text>
    <rect x="580" y="58" width="110" height="6" rx="3" fill="#424242"/>
    <rect x="580" y="58" width="95" height="6" rx="3" fill="url(#greenGrad)"/>
  </g>

  <!-- Phase 5 -->
  <g transform="translate(40, 800)">
    <rect width="720" height="90" rx="12" fill="#252525"/>
    <rect width="6" height="90" rx="3" fill="url(#purpleGrad)"/>
    <text x="30" y="28" fill="#AB47BC" font-size="12" font-weight="700" letter-spacing="1">PHASE 5</text>
    <text x="30" y="50" fill="white" font-size="16" font-weight="600">Konva.js + Polish UX</text>
    <text x="30" y="72" fill="#9E9E9E" font-size="13">Pinch zoom natif, drag lift, polygone vert/rouge, partage PNG</text>
    <rect x="580" y="20" width="110" height="28" rx="14" fill="#AB47BC" opacity="0.15"/>
    <text x="635" y="39" fill="#AB47BC" font-size="12" font-weight="600" text-anchor="middle">~5 échanges</text>
    <rect x="580" y="58" width="110" height="6" rx="3" fill="#424242"/>
    <rect x="580" y="58" width="80" height="6" rx="3" fill="url(#purpleGrad)"/>
  </g>

