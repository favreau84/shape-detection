  <line x1="40" y1="960" x2="760" y2="960" stroke="#424242" stroke-width="1"/>

  <g transform="translate(40, 975)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="110" height="36" rx="8" fill="#252525" stroke="#424242" stroke-width="1"/>
    <text x="55" y="23" fill="#42A5F5" font-size="13" font-weight="600" text-anchor="middle">React 19</text>

    <rect x="125" y="0" width="80" height="36" rx="8" fill="#252525" stroke="#424242" stroke-width="1"/>
    <text x="165" y="23" fill="#FF9800" font-size="13" font-weight="600" text-anchor="middle">Vite 8</text>

    <rect x="220" y="0" width="120" height="36" rx="8" fill="#252525" stroke="#424242" stroke-width="1"/>
    <text x="280" y="23" fill="#66BB6A" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="355" y="0" width="110" height="36" rx="8" fill="#252525" stroke="#424242" stroke-width="1"/>
    <text x="410" y="23" fill="#AB47BC" font-size="13" font-weight="600" text-anchor="middle">Konva.js</text>

    <rect x="480" y="0" width="120" height="36" rx="8" fill="#252525" stroke="#424242" stroke-width="1"/>
    <text x="540" y="23" fill="#EF5350" font-size="13" font-weight="600" text-anchor="middle">OpenCV.js</text>

    <rect x="615" y="0" width="105" height="36" rx="8" fill="#252525" stroke="#424242" stroke-width="1"/>
    <text x="667" y="23" fill="#9E9E9E" font-size="13" font-weight="600" text-anchor="middle">GH Pages</text>
  </g>

  <!-- Estimation -->
  <text x="40" y="1065" fill="white" font-size="20" font-weight="700">Estimation équivalent dev senior</text>
  <line x1="40" y1="1080" x2="760" y2="1080" stroke="#424242" stroke-width="1"/>

  <g transform="translate(40, 1095)">
    <!-- Bar chart -->
    <g>
      <text x="0" y="18" fill="#9E9E9E" font-size="12" font-weight="500">Setup + CI/CD</text>
      <rect x="180" y="6" width="580" height="18" rx="4" fill="#303030"/>
      <rect x="180" y="6" width="36" height="18" rx="4" fill="url(#orangeGrad)"/>
      <text x="225" y="19" fill="#B0B0B0" font-size="11" font-weight="600">0.5j</text>
    </g>
    <g transform="translate(0, 32)">
      <text x="0" y="18" fill="#9E9E9E" font-size="12" font-weight="500">Éditeur polygone</text>
      <rect x="180" y="6" width="580" height="18" rx="4" fill="#303030"/>
      <rect x="180" y="6" width="145" height="18" rx="4" fill="url(#blueGrad)"/>
      <text x="335" y="19" fill="#B0B0B0" font-size="11" font-weight="600">2j</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="18" fill="#9E9E9E" font-size="12" font-weight="500">Détection OpenCV</text>
      <rect x="180" y="6" width="580" height="18" rx="4" fill="#303030"/>
      <rect x="180" y="6" width="200" height="18" rx="4" fill="url(#greenGrad)"/>
      <text x="390" y="19" fill="#B0B0B0" font-size="11" font-weight="600">2-3j</text>
    </g>
    <g transform="translate(0, 96)">
      <text x="0" y="18" fill="#9E9E9E" font-size="12" font-weight="500">UX polish</text>
      <rect x="180" y="6" width="580" height="18" rx="4" fill="#303030"/>
      <rect x="180" y="6" width="72" height="18" rx="4" fill="url(#purpleGrad)"/>
      <text x="262" y="19" fill="#B0B0B0" font-size="11" font-weight="600">1j</text>
    </g>
    <g transform="translate(0, 128)">
      <text x="0" y="18" fill="#9E9E9E" font-size="12" font-weight="500">Résultat + partage</text>
      <rect x="180" y="6" width="580" height="18" rx="4" fill="#303030"/>
      <rect x="180" y="6" width="36" height="18" rx="4" fill="url(#redGrad)"/>
      <text x="225" y="19" fill="#B0B0B0" font-size="11" font-weight="600">0.5j</text>
    </g>
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#9E9E9E" font-size="12" font-weight="500">Debug / itérations</text>
      <rect x="180" y="6" width="580" height="18" rx="4" fill="#303030"/>
      <rect x="180" y="6" width="72" height="18" rx="4" fill="#757575"/>
      <text x="262" y="19" fill="#B0B0B0" font-size="11" font-weight="600">1j</text>
    </g>
  </g>

  <!-- Total badge -->
  <rect x="480" y="1310" width="280" height="60" rx="16" fill="#F57C00"/>
  <text x="545" y="1348" fill="white" font-size="16" font-weight="600">Total équivalent</text>
  <text x="725" y="1349" fill="white" font-size="26" font-weight="800" text-anchor="middle">7-8j</text>

  <!-- Realized in badge -->
  <rect x="40" y="1310" width="420" height="60" rx="16" fill="#252525" stroke="#F57C00" stroke-width="2"/>
  <text x="250" y="1345" fill="#F57C00" font-size="18" font-weight="700" text-anchor="middle">Réalisé en 1 après-midi avec Claude</text>

</svg>
